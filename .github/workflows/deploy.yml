name: Deploy Bolao 2026

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-bolao-2026
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy para VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configurar SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/bolaocopa_key
          chmod 600 ~/.ssh/bolaocopa_key

          if [ ! -s ~/.ssh/bolaocopa_key ]; then
            echo "Erro: secret VPS_SSH_KEY não configurado ou vazio."
            exit 1
          fi

          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_PORT="${{ secrets.VPS_PORT }}"
          VPS_PORT="${VPS_PORT:-22}"

          if [ -z "$VPS_HOST" ]; then
            echo "Erro: secret VPS_HOST não configurado."
            exit 1
          fi

          echo "Usando VPS_HOST=$VPS_HOST"
          echo "Usando VPS_PORT=$VPS_PORT"

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy na VPS
        shell: bash
        run: |
          set -Eeuo pipefail

          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_USER="${{ secrets.VPS_USER }}"
          VPS_PORT="${{ secrets.VPS_PORT }}"
          VPS_PORT="${VPS_PORT:-22}"

          if [ -z "$VPS_HOST" ]; then
            echo "Erro: secret VPS_HOST não configurado."
            exit 1
          fi

          if [ -z "$VPS_USER" ]; then
            echo "Erro: secret VPS_USER não configurado."
            exit 1
          fi

          ssh \
            -i ~/.ssh/bolaocopa_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s" << 'EOF'
              set -Eeuo pipefail

              PROJECT_ROOT="/srv/apps/bolaocopa"
              APP_DIR="$PROJECT_ROOT/src"

              trap '
                echo ""
                echo "== ERRO NO DEPLOY =="
                echo "Comando falhou. Exibindo diagnóstico dos containers:"
                cd "$PROJECT_ROOT" 2>/dev/null || true
                docker compose ps || true
                docker compose logs -n 80 app nginx horizon reverb scheduler || true
              ' ERR

              echo "== Validando ambiente da VPS =="
              command -v docker >/dev/null
              docker compose version

              echo "== Acessando projeto Laravel =="
              cd "$APP_DIR"

              echo "== Atualizando código pelo Git =="
              git fetch --tags origin main
              git reset --hard origin/main

              echo "== Validando arquivos essenciais do projeto =="
              test -f composer.json
              test -f composer.lock
              test -f package.json
              test -f package-lock.json
              test -f .env

              if ! grep -qE '^APP_KEY=.+$' .env; then
                echo "Erro: APP_KEY ausente ou vazio no .env."
                exit 1
              fi

              echo "== Calculando versão da aplicação =="
              if git describe --tags --exact-match >/dev/null 2>&1; then
                APP_VERSION="$(git describe --tags --exact-match)"
              else
                APP_VERSION="$(git rev-parse --abbrev-ref HEAD)-$(git rev-parse --short HEAD)"
              fi

              echo "APP_VERSION=$APP_VERSION"

              if grep -q '^APP_VERSION=' .env; then
                sed -i "s|^APP_VERSION=.*|APP_VERSION=$APP_VERSION|" .env
              else
                echo "APP_VERSION=$APP_VERSION" >> .env
              fi

              if grep -q '^PWA_BUILD_ID=' .env; then
                sed -i "s|^PWA_BUILD_ID=.*|PWA_BUILD_ID=$APP_VERSION|" .env
              else
                echo "PWA_BUILD_ID=$APP_VERSION" >> .env
              fi

              echo "== Acessando compose externo =="
              cd "$PROJECT_ROOT"

              echo "== Validando docker-compose.yml =="
              docker compose config -q

              echo "== [1/10] Buildando imagens Docker =="
              docker compose build app reverb horizon scheduler

              echo "== [2/10] Garantindo DB e Redis ativos =="
              docker compose up -d db redis

              echo "== [3/10] Instalando dependências PHP =="
              docker compose run --rm \
                --user root \
                -e COMPOSER_ALLOW_SUPERUSER=1 \
                -e COMPOSER_HOME=/tmp/composer \
                app composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

              echo "== Validando autoload do Composer =="
              test -f "$APP_DIR/vendor/autoload.php"

              docker compose run --rm app php -r "require 'vendor/autoload.php'; echo 'Composer autoload OK'.PHP_EOL;"

              echo "== [4/10] Buildando assets front-end =="
              docker compose run --rm \
                --user root \
                -e NPM_CONFIG_CACHE=/tmp/npm-cache \
                -e NODE_ENV=production \
                app bash -lc '
                  set -Eeuo pipefail

                  echo "Node:"
                  node -v

                  echo "NPM:"
                  npm -v

                  echo "Instalando dependências front-end:"
                  npm ci --include=dev

                  echo "Limpando build anterior do Vite:"
                  rm -rf public/build

                  echo "Rodando Vite build:"
                  npm run build

                  echo "Validando manifest:"
                  test -f public/build/manifest.json

                  echo "Validando chunk atualizado da tela de palpites:"
                  grep -R "Filtrar hoje" public/build/assets/PoolDetailView-*.js
                  grep -R "prediction-filter-chip" public/build/assets/PoolDetailView-*.js
                '

              echo "== Validando manifest do Vite no host =="
              test -f "$APP_DIR/public/build/manifest.json"

              echo "== [5/10] Ajustando permissões =="
              docker compose run --rm --user root app sh -lc '
                chown -R 1000:1000 vendor storage bootstrap/cache public/build node_modules 2>/dev/null || true
                chmod -R ug+rw storage bootstrap/cache public/build vendor 2>/dev/null || true
                chmod -R a+rX public 2>/dev/null || true
              '

              echo "== [6/10] Limpando caches antigos =="
              rm -f "$APP_DIR/bootstrap/cache/"*.php || true
              docker compose run --rm app php artisan optimize:clear
              docker compose run --rm app php artisan cache:clear

              echo "== [7/10] Validando Laravel antes das migrations =="
              docker compose run --rm app php artisan about

              echo "== [8/10] Rodando migrations =="
              docker compose run --rm app php artisan migrate --force --verbose

              echo "== [9/10] Encerrando Horizon para reinício limpo =="
              docker compose exec -T app php artisan horizon:terminate 2>/dev/null || true
              sleep 5

              echo "== [10/10] Subindo containers =="
              docker compose up -d --remove-orphans app nginx horizon reverb scheduler

              echo "== Otimizando aplicação =="
              docker compose exec -T app php artisan optimize

              echo "== Encerrando Horizon para workers recarregarem código =="
              docker compose exec -T app php artisan horizon:terminate 2>/dev/null || true

              echo "== Reiniciando serviços auxiliares =="
              docker compose restart scheduler reverb

              echo "== Aguardando estabilização dos containers =="
              sleep 20

              echo "== Status final dos containers =="
              docker compose ps

              echo "== Validando arquivos críticos finais =="
              test -f "$APP_DIR/vendor/autoload.php"
              test -f "$APP_DIR/public/build/manifest.json"

              echo "Deploy interno concluído."
          EOF

      - name: Health check externo
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_URL="https://bolao.vixforge.com.br"

          echo "Aguardando aplicação estabilizar..."
          sleep 10

          PHP_ERROR_PATTERN='Fatal error|Warning: require|Failed opening required|vendor/autoload.php|Whoops|Call to undefined|SQLSTATE|Illuminate\\|Symfony\\Component\\ErrorHandler|RedisException|QueryException'

          curl_status() {
            local output_file="$1"
            local url="$2"
            shift 2

            local status
            if ! status="$(curl -k -sS "$@" --max-time 20 -o "$output_file" -w "%{http_code}" "$url")"; then
              status="000"
            fi

            printf '%s' "$status"
          }

          echo "== Health check: /health =="

          HEALTH_OK=0

          for attempt in {1..12}; do
            echo "Tentativa $attempt/12..."

            HEALTH_STATUS="$(curl_status /tmp/health.json "$BASE_URL/health" -L)"

            echo "HTTP /health status: $HEALTH_STATUS"

            if [ -f /tmp/health.json ]; then
              cat /tmp/health.json
              echo ""
            fi

            if [ "$HEALTH_STATUS" = "200" ] && grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              HEALTH_OK=1
              break
            fi

            sleep 5
          done

          if [ "$HEALTH_OK" != "1" ]; then
            echo "::error::Health check obrigatório falhou em /health. Esperado HTTP 200 e JSON com status=ok."
            echo "Resposta final:"
            cat /tmp/health.json || true
            exit 1
          fi

          echo "OK: /health retornou HTTP 200 com status=ok."

          echo "== Health check: /login =="

          LOGIN_STATUS="$(curl_status /tmp/login.html "$BASE_URL/login" -L)"

          echo "HTTP /login status: $LOGIN_STATUS"

          case "$LOGIN_STATUS" in
            200|302)
              echo "OK: /login retornou status aceito ($LOGIN_STATUS)."
              ;;
            *)
              echo "::error::Health check obrigatório falhou em /login. Esperado: 200 ou 302. Recebido: $LOGIN_STATUS"
              echo "Primeiras linhas da resposta:"
              head -n 60 /tmp/login.html || true
              exit 1
              ;;
          esac

          if grep -qiE "$PHP_ERROR_PATTERN" /tmp/login.html; then
            echo "::error::Health check obrigatório falhou: /login retornou erro PHP/Laravel no HTML."
            echo "Primeiras linhas da resposta:"
            head -n 80 /tmp/login.html || true
            exit 1
          fi

          echo "OK: /login não contém erro PHP/Laravel explícito."

          if [ "$LOGIN_STATUS" = "200" ] && ! grep -qiE 'entrar|login|email|senha|password|csrf-token|_token|build/assets|vite|livewire' /tmp/login.html; then
            echo "::error::Health check obrigatório falhou: /login retornou 200, mas não parece ser a tela esperada."
            echo "Primeiras linhas da resposta:"
            head -n 80 /tmp/login.html || true
            exit 1
          fi

          if [ "$LOGIN_STATUS" = "200" ]; then
            echo "OK: /login parece conter a tela esperada."
          fi

          echo "== Health check: assets Vite detectados no HTML =="

          ASSET_PATH="$(grep -oE '/build/assets/[^"]+\.(css|js)' /tmp/login.html | head -n1 || true)"

          if [ -n "$ASSET_PATH" ]; then
            echo "Asset detectado: $ASSET_PATH"

            ASSET_OK=0
            ASSET_STATUS="000"
            for attempt in {1..3}; do
              ASSET_STATUS="$(curl_status /dev/null "$BASE_URL$ASSET_PATH" -L)"
              echo "Tentativa asset $attempt/3: HTTP $ASSET_STATUS"
              if [ "$ASSET_STATUS" = "200" ]; then
                ASSET_OK=1
                break
              fi
              sleep 3
            done

            if [ "$ASSET_OK" != "1" ]; then
              echo "::error::Health check obrigatório falhou: asset crítico do Vite não carregou após retry. Último status: $ASSET_STATUS"
              exit 1
            fi

            echo "OK: asset crítico do Vite carregou."
          else
            echo "::warning::Aviso: nenhum asset /build/assets detectado no HTML de /login."
          fi

          echo "== Health check: Livewire =="

          LIVEWIRE_PATH="$(grep -oE 'src="[^"]*livewire[^"]*\.js[^"]*"' /tmp/login.html | sed -E 's/src="([^"]+)"/\1/' | head -n1 || true)"
          LIVEWIRE_STATUS=""
          LIVEWIRE_PREFIX=""

          if [ -n "$LIVEWIRE_PATH" ]; then
            case "$LIVEWIRE_PATH" in
              http://*|https://*)
                LIVEWIRE_URL="$LIVEWIRE_PATH"
                LIVEWIRE_PREFIX="$(printf '%s' "$LIVEWIRE_PATH" | sed -E 's#https?://[^/]+(/livewire-[^/]+)/livewire.*#\1#')"
                ;;
              *)
                LIVEWIRE_URL="$BASE_URL$LIVEWIRE_PATH"
                LIVEWIRE_PREFIX="$(printf '%s' "$LIVEWIRE_PATH" | sed -E 's#(/livewire-[^/]+)/livewire.*#\1#')"
                ;;
            esac

            echo "Livewire JS detectado: $LIVEWIRE_PATH"
            echo "Livewire prefix detectado: ${LIVEWIRE_PREFIX:-<não encontrado>}"

            LIVEWIRE_JS_OK=0
            for attempt in {1..3}; do
              LIVEWIRE_STATUS="$(curl_status /dev/null "$LIVEWIRE_URL" -L)"
              echo "Tentativa Livewire JS $attempt/3: HTTP $LIVEWIRE_STATUS"
              if [ "$LIVEWIRE_STATUS" = "200" ]; then
                LIVEWIRE_JS_OK=1
                break
              fi
              sleep 3
            done

            if [ "$LIVEWIRE_JS_OK" != "1" ]; then
              echo "::error::Health check Livewire JS falhou após retry. Esperado: 200. Último status: $LIVEWIRE_STATUS"
              exit 1
            fi

            echo "OK: Livewire JS carregou."
          else
            echo "::warning::Aviso: script Livewire não encontrado no HTML de /login."
          fi

          LIVEWIRE_UPDATE_URI="$(grep -oE 'data-update-uri="[^"]+"' /tmp/login.html | sed -E 's/data-update-uri="([^"]+)"/\1/' | head -n1 || true)"

          if [ -n "$LIVEWIRE_UPDATE_URI" ]; then
            echo "Livewire update URI detectado no HTML: $LIVEWIRE_UPDATE_URI"

            case "$LIVEWIRE_UPDATE_URI" in
              http://*|https://*)
                LIVEWIRE_UPDATE_URL="$LIVEWIRE_UPDATE_URI"
                ;;
              *)
                LIVEWIRE_UPDATE_URL="$BASE_URL$LIVEWIRE_UPDATE_URI"
                ;;
            esac

          elif [ -n "$LIVEWIRE_PREFIX" ] && [ "$LIVEWIRE_PREFIX" != "$LIVEWIRE_PATH" ]; then
            LIVEWIRE_UPDATE_URL="$BASE_URL$LIVEWIRE_PREFIX/update"
            echo "Livewire update URI inferido pelo prefixo: $LIVEWIRE_PREFIX/update"

          else
            LIVEWIRE_UPDATE_URL="$BASE_URL/livewire/update"
            echo "Aviso: não foi possível detectar prefixo Livewire. Usando fallback /livewire/update."
          fi

          echo "Livewire update URL testada: $LIVEWIRE_UPDATE_URL"

          LIVEWIRE_UPDATE_OK=0
          LIVEWIRE_UPDATE_STATUS="000"
          for attempt in {1..3}; do
            LIVEWIRE_UPDATE_STATUS="$(curl_status /dev/null "$LIVEWIRE_UPDATE_URL" -L -X POST)"
            echo "Tentativa Livewire update $attempt/3: HTTP $LIVEWIRE_UPDATE_STATUS"
            case "$LIVEWIRE_UPDATE_STATUS" in
              200|405|419|422)
                LIVEWIRE_UPDATE_OK=1
                break
                ;;
            esac
            sleep 3
          done

          if [ "$LIVEWIRE_UPDATE_OK" != "1" ]; then
            echo "::error::Health check Livewire update falhou após retry. Esperado: 200, 405, 419 ou 422. Último status: $LIVEWIRE_UPDATE_STATUS"
            exit 1
          fi

          echo "OK: Livewire update endpoint respondeu dentro do esperado ($LIVEWIRE_UPDATE_STATUS)."

          echo "== Health check: /horizon =="

          HORIZON_STATUS="$(curl_status /tmp/horizon.html "$BASE_URL/horizon" -L)"

          echo "HTTP /horizon status: $HORIZON_STATUS"

          if grep -qiE "$PHP_ERROR_PATTERN" /tmp/horizon.html; then
            echo "::warning::Aviso: /horizon retornou erro PHP/Laravel explícito no HTML. Não bloqueando deploy."
            echo "Primeiras linhas da resposta:"
            head -n 80 /tmp/horizon.html || true
          fi

          case "$HORIZON_STATUS" in
            200|302|401|403)
              echo "OK: /horizon respondeu com status diagnóstico aceitável ($HORIZON_STATUS)."
              ;;
            *)
              echo "::warning::Aviso: /horizon retornou status inesperado ($HORIZON_STATUS). Não bloqueando deploy."
              echo "Primeiras linhas da resposta:"
              head -n 80 /tmp/horizon.html || true
              ;;
          esac

          echo "Deploy OK."
