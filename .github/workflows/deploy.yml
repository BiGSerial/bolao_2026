name: Deploy Bolao 2026

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-bolao-2026
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy para VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configurar SSH
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/bolaocopa_key
          chmod 600 ~/.ssh/bolaocopa_key

          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_PORT="${{ secrets.VPS_PORT }}"
          VPS_PORT="${VPS_PORT:-22}"

          if [ -z "$VPS_HOST" ]; then
            echo "Erro: secret VPS_HOST não configurado."
            exit 1
          fi

          echo "Usando VPS_HOST=$VPS_HOST"
          echo "Usando VPS_PORT=$VPS_PORT"

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy na VPS
        run: |
          set -e

          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_USER="${{ secrets.VPS_USER }}"
          VPS_PORT="${{ secrets.VPS_PORT }}"
          VPS_PORT="${VPS_PORT:-22}"

          if [ -z "$VPS_HOST" ]; then
            echo "Erro: secret VPS_HOST não configurado."
            exit 1
          fi

          if [ -z "$VPS_USER" ]; then
            echo "Erro: secret VPS_USER não configurado."
            exit 1
          fi

          ssh \
            -i ~/.ssh/bolaocopa_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
              set -e

              echo "== Acessando projeto Laravel =="
              cd /srv/apps/bolaocopa/src

              echo "== Atualizando código pelo Git =="
              git fetch origin main
              git reset --hard origin/main

              echo "== Calculando versão da aplicação =="
              if git describe --tags --exact-match >/dev/null 2>&1; then
                APP_VERSION="$(git describe --tags --exact-match)"
              else
                APP_VERSION="$(git rev-parse --abbrev-ref HEAD)-$(git rev-parse --short HEAD)"
              fi
              echo "APP_VERSION=$APP_VERSION"
              if grep -q '^APP_VERSION=' .env; then
                sed -i "s/^APP_VERSION=.*/APP_VERSION=$APP_VERSION/" .env
              else
                echo "APP_VERSION=$APP_VERSION" >> .env
              fi

              echo "== Voltando para compose externo =="
              cd /srv/apps/bolaocopa

              echo "== [1/8] Buildando imagens Docker =="
              docker compose build app reverb horizon scheduler

              echo "== [2/8] Instalando dependências PHP =="
              docker compose run --rm \
                -e COMPOSER_HOME=/tmp/composer \
                app composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

              echo "== [3/8] Buildando assets front-end =="
              docker compose run --rm \
                -e NPM_CONFIG_CACHE=/tmp/npm-cache \
                -e NODE_ENV=production \
                app sh -c 'npm ci --include=dev && npm run build'

              echo "== Validando manifest do Vite =="
              test -f src/public/build/manifest.json

              echo "== [4/8] Limpando caches antigos =="
              rm -f src/bootstrap/cache/*.php
              docker compose run --rm app php artisan optimize:clear
              docker compose run --rm app php artisan cache:clear

              echo "== [5/8] Rodando migrations =="
              docker compose run --rm app php artisan migrate --force --verbose

              echo "== [6/8] Ajustando permissões =="
              chmod -R ug+rw src/storage src/bootstrap/cache || true
              chmod -R a+rX src/public || true

              echo "== [7/8] Encerrando Horizon (drena jobs em andamento) =="
              docker compose exec -T app php artisan horizon:terminate 2>/dev/null || true
              sleep 5

              echo "== [8/8] Subindo containers e otimizando =="
              docker compose up -d --remove-orphans
              docker compose exec -T app php artisan optimize
              docker compose restart scheduler reverb

              echo "== Status final dos containers =="
              docker compose ps
          EOF

      - name: Health check externo
        run: |
          set -e

          sleep 8

          BASE_URL="https://bolao.woti.com.br"
          LOGIN_HTML="$(curl -k -sS "$BASE_URL/login")"
          STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$BASE_URL/login")

          LIVEWIRE_PATH="$(printf '%s' "$LOGIN_HTML" | grep -oE '/livewire-[^"]+/livewire(\.min)?\.js\?id=[^"]+' | head -n1 || true)"
          LIVEWIRE_UPDATE_STATUS="$(curl -k -s -o /dev/null -w "%{http_code}" -X POST "$BASE_URL/livewire/update" || true)"
          LIVEWIRE_STATUS=""

          if [ -n "$LIVEWIRE_PATH" ]; then
            LIVEWIRE_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$BASE_URL$LIVEWIRE_PATH")
          else
            echo "Aviso: script Livewire não encontrado no HTML de /login; validando endpoint /livewire/update."
          fi

          echo "HTTP status: $STATUS"
          echo "Livewire path detectado: ${LIVEWIRE_PATH:-<não encontrado>}"
          echo "Livewire JS status: ${LIVEWIRE_STATUS:-<não validado>}"
          echo "Livewire update status: $LIVEWIRE_UPDATE_STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Health check falhou. Esperado: 200. Recebido: $STATUS"
            exit 1
          fi

          if [ -n "$LIVEWIRE_PATH" ] && [ "$LIVEWIRE_STATUS" != "200" ]; then
            echo "Health check Livewire JS falhou. Esperado: 200. Recebido: $LIVEWIRE_STATUS"
            exit 1
          fi

          case "$LIVEWIRE_UPDATE_STATUS" in
            200|405|419|422)
              ;;
            *)
              echo "Health check Livewire endpoint falhou. Esperado: 200/405/419/422. Recebido: $LIVEWIRE_UPDATE_STATUS"
              exit 1
              ;;
          esac

          if [ -z "$LIVEWIRE_PATH" ]; then
            if ! printf '%s' "$LOGIN_HTML" | grep -qiE 'csrf-token|name="_token"|login'; then
              echo "Health check HTML falhou: página /login sem marcadores básicos esperados."
              exit 1
            fi
          fi

          echo "Deploy OK."
