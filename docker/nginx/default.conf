# ─── HTTP / Laravel app ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Docker DNS — resolve nomes de container dinamicamente
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Static assets com cache longo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA / Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream "app:9000";
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ─── WebSocket / Reverb ────────────────────────────────────────────────────────
server {
    listen 8081;
    server_name _;

    # Docker DNS — resolve o container reverb dinamicamente a cada 10s.
    # Sem isso, nginx cacheia o IP na inicialização e quebra quando o container
    # é recriado e recebe um novo IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tempos generosos para conexões WebSocket de longa duração
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 10s;

    location / {
        # Variável força nginx a resolver via DNS a cada requisição (+ cache do resolver)
        set $reverb_upstream "reverb:8080";

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";

        proxy_pass http://$reverb_upstream;
    }
}
