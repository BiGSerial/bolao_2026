services:

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: bolao_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bolao_net

  reverb:
    build:
      context: .
      dockerfile: docker/reverb/Dockerfile
    container_name: bolao_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - bolao_net

  nginx:
    image: nginx:1.27-alpine
    container_name: bolao_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "${REVERB_PORT:-8081}:8081"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - bolao_net

  mysql:
    image: mysql:8.4
    container_name: bolao_mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bolao}
      MYSQL_USER: ${DB_USERNAME:-bolao}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bolao123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - bolao_net

  redis:
    image: redis:7-alpine
    container_name: bolao_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - bolao_net

volumes:
  mysql_data:
  redis_data:

networks:
  bolao_net:
    driver: bridge
